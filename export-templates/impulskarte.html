<style>
  /* Trennfarbe der Impulskarte - hier anpassen, wenn das Template fuer ein neues Design kopiert wird */
  .impulskarte { --divider-color: #6a1b9a; }

  /* Feste Box statt height:100% - damit die Karte nie groesser als eine A4-Quer-Seite wird
     und nie auf eine 2. Seite laeuft, unabhaengig vom Inhalt. Breite muss zu PAGE_SIZES.a4 in
     index.html passen (a4 quer, 96dpi, 1122x794), weil templates.yaml fuer dieses Template
     size: a4 setzt. Hoehe bewusst deutlich unter 794px (650px, ~150px Puffer) - Chromes
     Druckdialog reserviert per Default oben/unten Platz fuer eigene Kopf-/Fusszeile (Titel,
     URL, Seitenzahl), unabhaengig von @page margin:0 - das laesst sich nur im Druckdialog
     selbst abschalten ("Headers and footers" aus, oder Margins auf "None"), nicht per CSS.
     90% Puffer hat in der Praxis nicht gereicht, darum grosszuegiger. overflow:hidden kappt
     im Zweifel lieber Inhalt als eine 2. Seite zu erzeugen. */
  .impulskarte { display: flex; flex-direction: column; width: 1122px; height: 650px; overflow: hidden; }

  .impulskarte-bild { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .impulskarte-bild img {
    /* max-width/max-height:280px kommt von der globalen .tpl-img-Klasse (fuer die Feldliste
       in indexkarte1/2 gedacht) - hier explizit aufheben, sonst bleibt das Bild trotz
       width/height:100% auf 280x280px begrenzt. */
    width: 100%; height: 100%; max-width: none; max-height: none;
    object-fit: cover; display: block; margin: 0; border: 0;
  }

  .impulskarte-trenner { flex: 0 0 auto; height: 10px; background: var(--divider-color); }

  .impulskarte-headline { flex: 0 0 auto; padding: 1.2rem 1.75rem; }
  .impulskarte-headline p { margin: 0; font-size: 1.7rem; font-weight: 700; line-height: 1.25; }

  .impulskarte ~ .tpl-id { background: rgba(255, 255, 255, 0.85); padding: 0.15rem 0.5rem; border-radius: 3px; }
</style>

<div class="impulskarte">
  <div class="impulskarte-bild" data-field="bild">
    {{bild_img}}
  </div>

  <div class="impulskarte-trenner"></div>

  <div class="impulskarte-headline" data-field="ueberschrift">
    <p>{{ueberschrift}}</p>
  </div>
</div>

<div class="tpl-id">{{id}}</div>
