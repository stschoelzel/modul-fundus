<style>
  /* Trennfarbe der Impulskarte - hier anpassen, wenn das Template fuer ein neues Design kopiert wird */
  .impulskarte { --divider-color: #6a1b9a; }

  .impulskarte { display: flex; flex-direction: column; height: 100%; }

  .impulskarte-bild { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .impulskarte-bild img { width: 100%; height: 100%; object-fit: cover; display: block; margin: 0; border: 0; }

  .impulskarte-trenner { flex: 0 0 auto; height: 10px; background: var(--divider-color); }

  .impulskarte-headline { flex: 0 0 auto; padding: 1.2rem 1.75rem; }
  .impulskarte-headline p { margin: 0; font-size: 1.7rem; font-weight: 700; line-height: 1.25; }

  .impulskarte ~ .tpl-id { background: rgba(255, 255, 255, 0.85); padding: 0.15rem 0.5rem; border-radius: 3px; }
</style>

<div class="impulskarte">
  <div class="impulskarte-bild" data-field="bild">
    {{bild_img}}
  </div>

  <div class="impulskarte-trenner"></div>

  <div class="impulskarte-headline" data-field="ueberschrift">
    <p>{{ueberschrift}}</p>
  </div>
</div>

<div class="tpl-id">{{id}}</div>
