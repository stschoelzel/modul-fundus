# Vorlagen fuer den Export-Dialog in index.html.
#
# Jede Vorlage verweist per "html" auf eine Datei in diesem Ordner. In der HTML-Datei
# werden Platzhalter wie {{kontext}} oder {{bild_img}} beim Export durch die Item-Daten
# ersetzt; ein Feld-Wrapper mit data-field="..." wird automatisch entfernt, wenn das Item
# den Wert nicht hat. Details: README, Abschnitt "Export-Vorlagen".
#
# Ein Vorschaubild ist optional: legt eine Datei <id>-preview.png (oder .jpg/.jpeg/.svg)
# in diesen Ordner, wird beim naechsten Build automatisch gefunden - kein Eintrag hier noetig.
#
# Neue Vorlage bauen: template-template.html in diesem Ordner kopieren/umbenennen (nicht
# selbst hier eintragen, dient nur als kommentierte Vorlage fuer die Vorlage) und hier
# referenzieren.

- id: impulskarte
  label: Impulskarte
  size: a4
  html: impulskarte.html
