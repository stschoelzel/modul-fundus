    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #14161a; z-index: 9999; }

      This page requires JavaScript to display.

<body>
  <div id="__bundler_thumbnail">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">

    <rect x="400" y="250" width="400" height="60" rx="8" fill="#f5c542"></rect>

</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"de\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\">\n<title>Meme-Generator<\u002Ftitle>\n\n<style>\n/* ============================================================\n   Meme-Schrift (optional)\n   Empfohlen: Anton oder Oswald – beide unter SIL Open Font License 1.1\n   (https://openfontlicense.org). Die OFL erlaubt Einbettung und\n   Weitergabe; der Lizenztext muss der Schrift beiliegen.\n   Den Base64-String der .woff2-Datei zwischen den Anführungszeichen\n   nach \"base64,\" einfügen. Bis dahin: Fallback auf Impact / Arial Black.\n   ============================================================ */\n/* FONT_BASE64_HIER_EINFÜGEN */\n@font-face{\n  font-family:\"MemeFont\";\n  src:url(\"data:font/woff2;base64,FONT_BASE64_HIER_EINFÜGEN\") format(\"woff2\");\n  font-weight:400 900;\n  font-display:block;\n}\n\nhtml,body{height:100%;margin:0;overflow:hidden;background:#14161a;overscroll-behavior:none}\n.mg-app{\n  --mg-bg:#14161a; --mg-panel:#1d2026; --mg-card:#262a32; --mg-card-2:#32373f;\n  --mg-line:#4a505c; --mg-text:#f3f4f2; --mg-muted:#b5bac4;\n  --mg-accent:#f5c542; --mg-accent-text:#14161a; --mg-focus:#ffd76a; --mg-danger:#ff8a80;\n  position:fixed;left:0;top:0;width:100%;height:100%;\n  display:flex;flex-direction:column;\n  box-sizing:border-box;color:var(--mg-text);background:var(--mg-bg);\n  font-family:system-ui,-apple-system,\"Segoe UI\",Helvetica,Arial,sans-serif;\n  font-size:1rem;line-height:1.35;-webkit-text-size-adjust:100%;\n  -webkit-tap-highlight-color:transparent;touch-action:manipulation;\n}\n.mg-app *,.mg-app *::before,.mg-app *::after{box-sizing:inherit}\n.mg-app [hidden]{display:none !important}\n.mg-app :focus-visible{outline:3px solid var(--mg-focus);outline-offset:2px}\n.mg-app select:focus:not(:focus-visible),.mg-app .mg-btn:focus:not(:focus-visible),.mg-app canvas:focus{outline:none}\n.mg-app .mg-selectwrap select:focus-visible{outline-offset:0}\n.mg-app button,.mg-app input,.mg-app select,.mg-app textarea{font:inherit;color:inherit}\n.mg-app .mg-vis-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}\n\n/* Kopf */\n.mg-app .mg-head{display:flex;align-items:center;gap:.4rem;padding:.4rem .6rem;padding-top:calc(.4rem + env(safe-area-inset-top));background:var(--mg-panel);flex:0 0 auto}\n.mg-app .mg-title{font-size:1rem;font-weight:700;margin:0;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n\n/* Buttons */\n.mg-app .mg-btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;\n  min-height:44px;min-width:44px;padding:.4rem .8rem;border-radius:10px;\n  border:1px solid var(--mg-line);background:var(--mg-card);color:var(--mg-text);\n  cursor:pointer;text-align:center;font-weight:600;font-size:.9rem;text-decoration:none;\n  position:relative;white-space:nowrap;\n}\n.mg-app .mg-btn:hover{background:var(--mg-card-2)}\n.mg-app .mg-btn:disabled{opacity:.4;cursor:default}\n.mg-app .mg-btn-primary{background:var(--mg-accent);color:var(--mg-accent-text);border-color:var(--mg-accent)}\n.mg-app .mg-btn-primary:hover{background:#ffd35a}\n.mg-app .mg-btn-danger{color:var(--mg-danger);border-color:var(--mg-danger)}\n.mg-app .mg-btn-danger:hover{background:#3a2426}\n.mg-app .mg-btn-icon{padding:0;width:44px;font-size:1.25rem;font-weight:400;border-color:transparent;background:transparent}\n.mg-app .mg-btn-icon:hover{background:var(--mg-card)}\n.mg-app .mg-btn[aria-pressed=\"true\"]{background:var(--mg-accent);color:var(--mg-accent-text);border-color:var(--mg-accent)}\n.mg-app .mg-btn .mg-overlay-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;border:0}\n\n/* Körper */\n.mg-app .mg-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}\n.mg-app .mg-canvas-wrap{flex:1 1 auto;min-height:0;min-width:0;position:relative;padding:.5rem}\n.mg-app .mg-canvas-wrap.mg-dropping::after{content:\"\";position:absolute;inset:.25rem;border:2px dashed var(--mg-accent);border-radius:8px;pointer-events:none}\n.mg-app canvas.mg-canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none;border-radius:6px;background:#111;cursor:grab}\n.mg-app canvas.mg-canvas.mg-dragging{cursor:grabbing}\n.mg-app .mg-toast{\n  position:absolute;left:50%;bottom:.75rem;transform:translateX(-50%);max-width:calc(100% - 2rem);\n  margin:0;padding:.45rem .9rem;border-radius:999px;font-size:.85rem;font-weight:600;\n  background:rgba(20,22,26,.92);color:var(--mg-text);border:1px solid var(--mg-line);\n  opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;\n}\n.mg-app .mg-toast.mg-show{opacity:1}\n\n/* Dock (unten bzw. rechts) */\n.mg-app .mg-dock{flex:0 0 auto;display:flex;flex-direction:column;background:var(--mg-panel);border-top:1px solid #2c313a;padding-bottom:env(safe-area-inset-bottom)}\n.mg-app .mg-foot{margin:0 .6rem;padding:.35rem 0 .4rem;font-size:.68rem;color:#7c828d;text-align:center;border-top:1px solid #2c313a}\n.mg-app .mg-foot a{color:inherit;text-decoration:none}\n.mg-app .mg-foot a:hover{color:var(--mg-text);text-decoration:underline}\n.mg-app .mg-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;padding:.5rem .6rem}\n.mg-app .mg-tabbtn{background:transparent;border-color:transparent;color:var(--mg-muted)}\n.mg-app .mg-tabbtn[aria-selected=\"true\"]{background:var(--mg-accent);color:var(--mg-accent-text);border-color:var(--mg-accent)}\n.mg-app .mg-panel{display:flex;flex-direction:column;max-height:48vh;overflow:auto;border-top:1px solid #2c313a}\n.mg-app .mg-panel .mg-sheet{border-top:0;max-height:none;overflow:visible}\n.mg-app .mg-panel.mg-sheet{gap:.75rem;padding:.6rem .75rem .75rem}\n.mg-app .mg-bar .mg-btn{min-height:48px}\n\n/* Text-Werkzeuge */\n.mg-app .mg-textbar{display:flex;flex-direction:column;gap:.45rem;padding:.6rem .6rem .5rem}\n.mg-app .mg-textbar[hidden]{display:none}\n.mg-app textarea.mg-textinput{\n  width:100%;min-height:52px;max-height:96px;padding:.55rem .7rem;border-radius:10px;resize:none;\n  border:1px solid var(--mg-line);background:var(--mg-bg);color:var(--mg-text);line-height:1.35;font-size:1rem;\n}\n.mg-app .mg-tools{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}\n.mg-app .mg-tools::-webkit-scrollbar{display:none}\n.mg-app .mg-tools .mg-btn{flex:0 0 auto;border-radius:999px;padding:.3rem .8rem}\n.mg-app .mg-selectwrap{position:relative;flex:0 0 auto}\n.mg-app .mg-selectwrap select{\n  appearance:none;-webkit-appearance:none;min-height:44px;padding:.3rem 1.9rem .3rem .8rem;border-radius:999px;\n  border:1px solid var(--mg-line);background:var(--mg-card);color:var(--mg-text);font-weight:600;font-size:.9rem;cursor:pointer;\n}\n.mg-app .mg-selectwrap::after{content:\"▾\";position:absolute;right:.7rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mg-muted)}\n.mg-app .mg-palette{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem;background:var(--mg-card);border-radius:10px}\n.mg-app .mg-pal{padding:0 .6rem;min-width:44px;border-radius:999px;background:var(--mg-bg)}\n.mg-app .mg-pal[aria-pressed=\"true\"]{outline:3px solid var(--mg-accent);outline-offset:-1px;background:var(--mg-bg);color:var(--mg-text)}\n.mg-app .mg-swatch{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000}\n\n/* Sheets */\n.mg-app .mg-sheet{border-top:1px solid #2c313a;padding:.5rem .75rem .75rem;display:flex;flex-direction:column;gap:.75rem;max-height:48vh;overflow:auto}\n.mg-app .mg-sheet[hidden]{display:none}\n.mg-app .mg-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}\n.mg-app .mg-sheet-head h2{margin:0;font-size:1rem}\n.mg-app .mg-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}\n.mg-app .mg-card{background:var(--mg-card);border-radius:10px;padding:.7rem;display:flex;flex-direction:column;gap:.6rem}\n.mg-app .mg-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}\n.mg-app .mg-card-title{margin:0;font-size:.95rem;font-weight:700}\n.mg-app .mg-note{margin:0;color:var(--mg-muted);font-size:.85rem;text-wrap:pretty}\n.mg-app .mg-field{display:flex;flex-direction:column;gap:.3rem}\n.mg-app .mg-field > label,.mg-app .mg-label{font-size:.875rem;font-weight:600}\n.mg-app .mg-field-inline{display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:36px}\n.mg-app .mg-value{color:var(--mg-muted);font-variant-numeric:tabular-nums;font-size:.85rem}\n.mg-app input[type=\"text\"],.mg-app .mg-sheet textarea{width:100%;min-height:44px;padding:.5rem .7rem;border-radius:8px;border:1px solid var(--mg-line);background:var(--mg-bg);color:var(--mg-text)}\n.mg-app .mg-sheet textarea{resize:vertical;line-height:1.35}\n.mg-app input[type=\"range\"]{width:100%;min-height:44px;accent-color:var(--mg-accent);margin:0;cursor:pointer}\n.mg-app .mg-check{display:flex;align-items:center;gap:.6rem;min-height:44px;cursor:pointer;font-weight:600;font-size:.9rem}\n.mg-app .mg-check input{width:22px;height:22px;accent-color:var(--mg-accent);margin:0;cursor:pointer}\n.mg-app .mg-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.5rem}\n.mg-app .mg-align{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}\n\n/* Layout-Auswahl */\n.mg-app .mg-layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}\n.mg-app .mg-layout-opt{position:relative}\n.mg-app .mg-layout-card{\n  display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.6rem .3rem;\n  background:var(--mg-card);border:2px solid var(--mg-line);border-radius:10px;\n  cursor:pointer;font-size:.8rem;font-weight:600;text-align:center;min-height:44px;hyphens:auto;\n}\n.mg-app .mg-layout-opt input:checked + .mg-layout-card{border-color:var(--mg-accent);background:var(--mg-card-2)}\n.mg-app .mg-layout-opt input:focus-visible + .mg-layout-card{outline:3px solid var(--mg-focus);outline-offset:2px}\n.mg-app .mg-ico{width:40px;height:30px;display:grid;gap:3px}\n.mg-app .mg-ico span{background:var(--mg-muted);border-radius:2px}\n.mg-app .mg-layout-opt input:checked + .mg-layout-card .mg-ico span{background:var(--mg-accent)}\n.mg-app .mg-ico-stack{grid-template-rows:1fr 1fr}\n.mg-app .mg-ico-side{grid-template-columns:1fr 1fr}\n\n/* Breite Bildschirme: Dock rechts */\n@media (min-width:900px){\n  .mg-app .mg-body{flex-direction:row}\n  .mg-app .mg-canvas-wrap{padding:1rem}\n  .mg-app .mg-dock{width:24rem;border-top:0;border-left:1px solid #2c313a;justify-content:flex-end}\n  .mg-app .mg-sheet,.mg-app .mg-panel{max-height:none;flex:0 1 auto}\n  .mg-app .mg-tools{flex-wrap:wrap;overflow:visible}\n}\n\n/* Dialoge */\n.mg-app dialog.mg-dialog{\n  background:var(--mg-panel);color:var(--mg-text);border:1px solid var(--mg-line);\n  border-radius:10px;padding:1.25rem;max-width:min(92vw,32rem);width:100%;font-family:inherit;\n}\n.mg-app dialog.mg-dialog::backdrop{background:rgba(0,0,0,.65)}\n.mg-app .mg-dialog h2{margin:0 0 .5rem;font-size:1.15rem}\n.mg-app .mg-dialog p{margin:0 0 1rem;color:var(--mg-muted)}\n.mg-app .mg-dialog-actions{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end}\n.mg-app .mg-export-img{display:block;max-width:100%;max-height:60vh;margin:0 auto 1rem;border-radius:6px}\n\n@media (prefers-reduced-motion: no-preference){\n  .mg-app .mg-btn,.mg-app .mg-layout-card{transition:background-color .15s,border-color .15s}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"mg-app\" id=\"mg-app\">\n  <header class=\"mg-head\">\n    <h1 class=\"mg-title\">Meme-Generator<\u002Fh1>\n    <button type=\"button\" class=\"mg-btn mg-btn-icon\" id=\"mg-undo\" disabled=\"\" aria-label=\"Rückgängig\" title=\"Rückgängig\">↶<\u002Fbutton>\n    <button type=\"button\" class=\"mg-btn mg-btn-icon\" id=\"mg-redo\" disabled=\"\" aria-label=\"Wiederholen\" title=\"Wiederholen\">↷<\u002Fbutton>\n    <button type=\"button\" class=\"mg-btn\" id=\"mg-share\" hidden=\"\">Teilen<\u002Fbutton>\n    <button type=\"button\" class=\"mg-btn mg-btn-primary\" id=\"mg-export\">Speichern<\u002Fbutton>\n    <button type=\"button\" class=\"mg-btn mg-btn-icon\" id=\"mg-more-btn\" aria-label=\"Mehr\" title=\"Mehr\" aria-expanded=\"false\">⋯<\u002Fbutton>\n  <\u002Fheader>\n\n  <div class=\"mg-body\">\n    <div class=\"mg-canvas-wrap\" id=\"mg-canvas-wrap\">\n      <canvas class=\"mg-canvas\" id=\"mg-canvas\" tabindex=\"0\" role=\"img\" aria-label=\"Meme-Vorschau\" aria-describedby=\"mg-canvas-desc\"><\u002Fcanvas>\n      <p class=\"mg-vis-hidden\" id=\"mg-canvas-desc\"><\u002Fp>\n      <p class=\"mg-vis-hidden\" id=\"mg-kbd-status\" role=\"status\" aria-live=\"polite\"><\u002Fp>\n      <p class=\"mg-toast\" id=\"mg-status\" role=\"status\" aria-live=\"polite\"><\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"mg-dock\" id=\"mg-dock\">\n      <!-- Bereich: Text -->\n      <div class=\"mg-panel\" id=\"mg-panel-text\" role=\"tabpanel\" aria-labelledby=\"mg-text-btn\" hidden=\"\">\n        <div id=\"mg-text-empty\" style=\"padding:.6rem .6rem 0\">\n          <button type=\"button\" class=\"mg-btn mg-btn-primary\" id=\"mg-add-text\" style=\"width:100%;min-height:48px\">+ Text hinzufügen<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"mg-textbar\" id=\"mg-textbar\" hidden=\"\">\n          <textarea class=\"mg-textinput\" id=\"mg-text-input\" rows=\"2\" placeholder=\"Text eingeben …\" aria-label=\"Text\"><\u002Ftextarea>\n          <div class=\"mg-palette\" id=\"mg-palette\" hidden=\"\">\n            <span class=\"mg-label\" id=\"mg-palette-title\" style=\"flex:0 0 100%\"><\u002Fspan>\n            <button type=\"button\" class=\"mg-btn mg-pal\" data-pal=\"none\" id=\"mg-pal-none\">Keine<\u002Fbutton>\n            <span id=\"mg-pal-swatches\" style=\"display:contents\"><\u002Fspan>\n            <button type=\"button\" class=\"mg-btn mg-pal\" id=\"mg-pal-custom\"><span class=\"mg-swatch\" id=\"mg-pal-custom-sw\" style=\"background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)\"><\u002Fspan>Eigene<input class=\"mg-overlay-input\" type=\"color\" id=\"mg-pal-input\" aria-label=\"Eigene Farbe\"><\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"mg-tools\">\n            <span class=\"mg-selectwrap\"><select id=\"mg-font\" aria-label=\"Schrift\"><\u002Fselect><\u002Fspan>\n            <button type=\"button\" class=\"mg-btn\" id=\"mg-color-btn\" aria-expanded=\"false\"><span class=\"mg-swatch\" id=\"mg-color-sw\"><\u002Fspan>Farbe<span class=\"mg-vis-hidden\" id=\"mg-color-name\"><\u002Fspan><\u002Fbutton>\n            <button type=\"button\" class=\"mg-btn\" id=\"mg-stroke-btn\" aria-expanded=\"false\"><span class=\"mg-swatch\" id=\"mg-stroke-sw\"><\u002Fspan>Kontur<span class=\"mg-vis-hidden\" id=\"mg-stroke-name\"><\u002Fspan><\u002Fbutton>\n            <button type=\"button\" class=\"mg-btn\" id=\"mg-upper\" aria-pressed=\"false\">AA<\u002Fbutton>\n            <button type=\"button\" class=\"mg-btn\" id=\"mg-bar\" aria-pressed=\"false\">Balken<\u002Fbutton>\n            <button type=\"button\" class=\"mg-btn\" id=\"mg-textmore-btn\" aria-expanded=\"false\">Format ▾<\u002Fbutton>\n            <button type=\"button\" class=\"mg-btn\" id=\"mg-dup-text\">Kopie<\u002Fbutton>\n            <button type=\"button\" class=\"mg-btn mg-btn-danger\" id=\"mg-del-text\">Löschen<\u002Fbutton>\n            <button type=\"button\" class=\"mg-btn\" id=\"mg-add-text-2\">+ Neu<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mg-sheet\" id=\"mg-sheet-textmore\" hidden=\"\">\n          <div class=\"mg-field\">\n            <div class=\"mg-field-inline\"><label for=\"mg-size\">Größe<\u002Flabel><span class=\"mg-value\" id=\"mg-size-val\"><\u002Fspan><\u002Fdiv>\n            <input type=\"range\" id=\"mg-size\" min=\"2\" max=\"30\" step=\"0.5\">\n          <\u002Fdiv>\n          <div class=\"mg-field\">\n            <div class=\"mg-field-inline\"><label for=\"mg-rot\">Drehung<\u002Flabel><span class=\"mg-value\" id=\"mg-rot-val\"><\u002Fspan><\u002Fdiv>\n            <div class=\"mg-row\" style=\"flex-wrap:nowrap\"><input type=\"range\" id=\"mg-rot\" min=\"-180\" max=\"180\" step=\"1\"><button type=\"button\" class=\"mg-btn\" id=\"mg-rot-reset\" aria-label=\"Drehung zurücksetzen\">0°<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mg-field\">\n            <div class=\"mg-field-inline\"><label for=\"mg-width\">Breite der Textbox<\u002Flabel><span class=\"mg-value\" id=\"mg-width-val\"><\u002Fspan><\u002Fdiv>\n            <input type=\"range\" id=\"mg-width\" min=\"20\" max=\"100\" step=\"1\">\n          <\u002Fdiv>\n          <div class=\"mg-field\">\n            <div class=\"mg-field-inline\"><label for=\"mg-strokew\">Konturstärke<\u002Flabel><span class=\"mg-value\" id=\"mg-strokew-val\"><\u002Fspan><\u002Fdiv>\n            <input type=\"range\" id=\"mg-strokew\" min=\"0\" max=\"25\" step=\"1\">\n          <\u002Fdiv>\n          <div class=\"mg-field\">\n            <span class=\"mg-label\" id=\"mg-align-label\">Ausrichtung bei mehreren Zeilen<\u002Fspan>\n            <div class=\"mg-align\" role=\"group\" aria-labelledby=\"mg-align-label\">\n              <button type=\"button\" class=\"mg-btn\" data-align=\"left\" aria-pressed=\"false\">Links<\u002Fbutton>\n              <button type=\"button\" class=\"mg-btn\" data-align=\"center\" aria-pressed=\"false\">Mitte<\u002Fbutton>\n              <button type=\"button\" class=\"mg-btn\" data-align=\"right\" aria-pressed=\"false\">Rechts<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Bereich: Layout -->\n      <div class=\"mg-panel mg-sheet\" id=\"mg-panel-layout\" role=\"tabpanel\" aria-labelledby=\"mg-layout-btn\" hidden=\"\">\n        <fieldset style=\"border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:.5rem\">\n          <legend class=\"mg-vis-hidden\">Anordnung<\u002Flegend>\n          <div class=\"mg-layouts\">\n            <div class=\"mg-layout-opt\">\n              <input class=\"mg-vis-hidden\" type=\"radio\" name=\"mg-layout\" id=\"mg-layout-single\" value=\"single\" checked=\"\">\n              <label class=\"mg-layout-card\" for=\"mg-layout-single\"><span class=\"mg-ico\" aria-hidden=\"true\"><span><\u002Fspan><\u002Fspan>Ein Bild<\u002Flabel>\n            <\u002Fdiv>\n            <div class=\"mg-layout-opt\">\n              <input class=\"mg-vis-hidden\" type=\"radio\" name=\"mg-layout\" id=\"mg-layout-stack\" value=\"stack\">\n              <label class=\"mg-layout-card\" for=\"mg-layout-stack\"><span class=\"mg-ico mg-ico-stack\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><\u002Fspan>Unter­einander<\u002Flabel>\n            <\u002Fdiv>\n            <div class=\"mg-layout-opt\">\n              <input class=\"mg-vis-hidden\" type=\"radio\" name=\"mg-layout\" id=\"mg-layout-side\" value=\"side\">\n              <label class=\"mg-layout-card\" for=\"mg-layout-side\"><span class=\"mg-ico mg-ico-side\" aria-hidden=\"true\"><span><\u002Fspan><span><\u002Fspan><\u002Fspan>Neben­einander<\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Ffieldset>\n        <label class=\"mg-check\"><input type=\"checkbox\" id=\"mg-labels-on\"> Bilder beschriften<\u002Flabel>\n        <div class=\"mg-grid2\" id=\"mg-label-fields\" hidden=\"\">\n          <div class=\"mg-field\"><label for=\"mg-label-0\">Bild 1<\u002Flabel><input type=\"text\" id=\"mg-label-0\" value=\"Vorher\" maxlength=\"40\"><\u002Fdiv>\n          <div class=\"mg-field\" id=\"mg-label-1-field\"><label for=\"mg-label-1\">Bild 2<\u002Flabel><input type=\"text\" id=\"mg-label-1\" value=\"Nachher\" maxlength=\"40\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fd <button type=\"button\" class=\"mg-btn mg-tabbtn\" id=\"mg-text-btn\" role=\"tab\" aria-selected=\"false\" aria-controls=\"mg-panel-text\">Text<\u002Fbutton>\n      <\u002Fdiv>\n      <p class=\"mg-foot\"><a href=\"https://www.medienpädagogik.info\" target=\"_blank\" rel=\"noopener\">www.medienpädagogik.info<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <dialog class=\"mg-dialog\" id=\"mg-reset-dialog\" aria-labelledby=\"mg-reset-title\">\n    <h2 id=\"mg-reset-title\">Wirklich alles zurücksetzen?<\u002Fh2>\n    <p>Bilder, Texte und Layout werden gelöscht.<\u002Fp>\n    <div class=\"mg-dialog-actions\">\n      <button type=\"button\" class=\"mg-btn\" id=\"mg-reset-cancel\">Abbrechen<\u002Fbutton>\n      <button type=\"button\" class=\"mg-btn mg-btn-danger\" id=\"mg-reset-confirm\">Ja, zurücksetzen<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdialog>\n\n  <dialog class=\"mg-dialog\" id=\"mg-export-dialog\" aria-labelledby=\"mg-export-title\">\n    <h2 id=\"mg-export-title\">Dein Meme ist fertig<\u002Fh2>\n    <p id=\"mg-export-hint\">Bild gedrückt halten und „Bild speichern“ wählen – oder unten herunterladen.<\u002Fp>\n    <img class=\"mg-export-img\" id=\"mg-export-img\" alt=\"Fertiges Meme\">\n    <p class=\"mg-note\" id=\"mg-export-meta\" style=\"text-align:center;margin-bottom:1rem\"><\u002Fp>\n    <div class=\"mg-dialog-actions\">\n      <button type=\"button\" class=\"mg-btn\" id=\"mg-export-close\">Schließen<\u002Fbutton>\n      <button type=\"button\" class=\"mg-btn\" id=\"mg-export-share\" hidden=\"\">Teilen<\u002Fbutton>\n      <a class=\"mg-btn mg-btn-primary\" id=\"mg-export-link\" download=\"\">Herunterladen<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdialog>\n<\u002Fdiv>\n\n<script>\n(function(){\n'use strict';\nvar root=document.getElementById('mg-app');\nfunction $(id){return document.getElementById(id);}\nfunction $$(sel){return Array.prototype.slice.call(root.querySelectorAll(sel));}\nfunction clamp(v,a,b){return Math.min(b,Math.max(a,v));}\n\nvar FONTS={\n  meme:{label:'Meme-Schrift',stack:'\"MemeFont\", Impact, \"Arial Black\", \"Helvetica Neue\", Arial, sans-serif',weight:'bold'},\n  sans:{label:'Serifenlos',stack:'\"Helvetica Neue\", Helvetica, Arial, sans-serif',weight:'bold'},\n  serif:{label:'Serifen',stack:'Georgia, \"Times New Roman\", Times, serif',weight:'bold'},\n  mono:{label:'Schreibmaschine',stack:'\"Courier New\", Courier, monospace',weight:'bold'},\n  hand:{label:'Handschrift',stack:'\"Segoe Print\", \"Bradley Hand\", \"Chalkboard SE\", \"Comic Sans MS\", cursive',weight:'normal'}\n};\nvar DEFAULT_STYLE={font:'meme',color:'#ffffff',stroke:'#000000',strokeW:0.08,align:'center',upper:true,bar:false};\nvar STORAGE_KEY='mg-einstellungen-v1',RES_KEY='mg-ausgabe-v1';\nvar maxRes=1600;try{var rr=localStorage.getItem(RES_KEY);if(rr!==null)maxRes=+rr||0;if(maxRes===2048)maxRes=1600;}catch(e){}\nvar isCoarse=window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;\nvar isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);\n\n/* ---------- Viewport (Tastatur auf dem Handy) ---------- */\nfunction fitViewport(){\n  var vv=window.visualViewport;if(!vv)return;\n  root.style.height=vv.height+'px';root.style.top=vv.offsetTop+'px';\n  if(window.scrollY)window.scrollTo(0,0);\n}\nif(window.visualViewport){window.visualViewport.addEventListener('resize',fitViewport);window.visualViewport.addEventListener('scroll',fitViewport);fitViewport();}\n\n/* ---------- Einstellungen merken ---------- */\nvar settings=Object.assign({},DEFAULT_STYLE);\ntry{var raw=localStorage.getItem(STORAGE_KEY);if(raw){var parsed=JSON.parse(raw);Object.keys(DEFAULT_STYLE).forEach(function(k){if(k in parsed)settings[k]=parsed[k];});if(!FONTS[settings.font])settings.font=DEFAULT_STYLE.font;}}catch(e){}\nfunction saveSettings(t){Object.keys(DEFAULT_STYLE).forEach(function(k){settings[k]=t[k];});try{localStorage.setItem(STORAGE_KEY,JSON.stringify(settings));}catch(e){}}\n\n/* ---------- Zustand & Verlauf ---------- */\nfunction freshState(){return {layout:'single',labelsOn:false,labels:['Vorher','Nachher'],panels:[{img:null,zoom:1,ox:0,oy:0},{img:null,zoom:1,ox:0,oy:0}],texts:[],selected:null,nextId:1};}\nfunction cloneState(s){return {layout:s.layout,labelsOn:s.labelsOn,labels:s.labels.slice(),panels:s.panels.map(function(p){return Object.assign({},p);}),texts:s.texts.map(function(t){return Object.assign({},t);}),selected:s.selected,nextId:s.nextId};}\nvar state=freshState();\nvar history=[cloneState(state)],histIndex=0,HIST_MAX=60;\nfunction commit(){history=history.slice(0,histIndex+1);history.push(cloneState(state));if(history.length>HIST_MAX)history.shift();histIndex=history.length-1;afterChange();}\nfunction undo(){if(histIndex>0){histIndex--;state=cloneState(history[histIndex]);afterChange();}}\nfunction redo(){if(histIndex<history.length-1){histIndex++;state=cloneState(history[histIndex]);afterChange();}}\nfunction afterChange(){$('mg-undo').disabled=histIndex<=0;$('mg-redo').disabled=histIndex>=history.length-1;syncControls();resizeCanvas();}\nfunction panelCount(){return state.layout==='single'?1:2;}\nfunction selectedText(){for(var i=0;i<state.texts.length;i++)if(state.texts[i].id===state.selected)return state.texts[i];return null;}\n\n/* ---------- Kurzmeldung ---------- */\nvar statusTimer;\nfunction status(msg){var el=$('mg-status');el.textContent=msg;el.classList.add('mg-show');clearTimeout(statusTimer);statusTimer=setTimeout(function(){el.classList.remove('mg-show');},3500);}\n\n/* ---------- Geometrie ---------- */\nfunction compSize(){\n  var n=panelCount(),loaded=[];\n  for(var i=0;i<n;i++)if(state.panels[i].img)loaded.push(state.panels[i].img);\n  var aspect=loaded.length?loaded[0].naturalWidth/loaded[0].naturalHeight:1;\n  var pw=1080;\n  if(loaded.length){pw=0;loaded.forEach(function(im){pw=Math.max(pw,im.naturalWidth);});}\n  pw=Math.max(pw,600);\n  var ph=Math.round(pw/aspect);\n  var W=state.layout==='side'?pw*2:pw,H=state.layout==='stack'?ph*2:ph,MAX=16e6,k=1;\n  if(W*H>MAX)k=Math.sqrt(MAX/(W*H));\n  if(maxRes&&Math.max(W,H)*k>maxRes)k=maxRes/Math.max(W,H);\n  if(k<1){W=Math.round(W*k);H=Math.round(H*k);pw=state.layout==='side'?W/2:W;ph=state.layout==='stack'?H/2:H;}\n  var rects=[{x:0,y:0,w:pw,h:ph}];\n  if(state.layout==='stack')rects.push({x:0,y:ph,w:pw,h:ph});\n  if(state.layout==='side')rects.push({x:pw,y:0,w:pw,h:ph});\n  return {W:W,H:H,pw:pw,ph:ph,rects:rects};\n}\nfunction imageRect(p,r){\n  var iw=p.img.naturalWidth,ih=p.img.naturalHeight,s=Math.max(r.w/iw,r.h/ih)*p.zoom,w=iw*s,h=ih*s;\n  var maxOx=(w-r.w)/2/r.w,maxOy=(h-r.h)/2/r.w;\n  p.ox=clamp(p.ox,-maxOx,maxOx);p.oy=clamp(p.oy,-maxOy,maxOy);\n  return {x:r.x+(r.w-w)/2+p.ox*r.w,y:r.y+(r.h-h)/2+p.oy*r.w,w:w,h:h};\n}\nvar cssPx=1;\nfunction rotHandle(L,cs){var r=cssPx*11,gap=cssPx*22;return {x:L.hit.x+L.hit.w/2,y:L.hit.y-L.fs*0.12-gap,r:r};}\nfunction hitRotHandle(pt,t){\n  var L=layoutText(measureCtx,t,curCs),hp=rotHandle(L,curCs),c=Math.cos(L.rot),s=Math.sin(L.rot);\n  var dx=hp.x-L.cx,dy=hp.y-L.cy,hx=L.cx+dx*c-dy*s,hy=L.cy+dx*s+dy*c;\n  return Math.hypot(pt.x-hx,pt.y-hy)<=cssPx*22?{cx:L.cx,cy:L.cy}:null;\n}\nfunction normRot(d){d=Math.round(d)%360;if(d>180)d-=360;if(d<-180)d+=360;return d;}\nfunction fontString(key,px){var f=FONTS[key]||FONTS.meme;return f.weight+' '+px+'px '+f.stack;}\nfunction luminance(hex){var n=parseInt(hex.slice(1),16);return (0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255))/255;}\n\nvar measureCtx=document.createElement('canvas').getContext('2d');\nfunction layoutText(ctx,t,cs){\n  var fs=t.size*cs.W,maxW=t.width*cs.W;\n  ctx.font=fontString(t.font,fs);\n  var src=(t.upper?t.text.toUpperCase():t.text)||' ',lines=[];\n  src.split('\\n').forEach(function(par){\n    var words=par.split(' '),line='';\n    words.forEach(function(w){var test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}else line=test;});\n    lines.push(line);\n  });\n  var lh=fs*1.15,h=lines.length*lh,textW=fs*0.4;\n  lines.forEach(function(l){textW=Math.max(textW,ctx.measureText(l).width);});\n  var cx=t.x*cs.W,cy=t.y*cs.H,left=cx-maxW/2,top=cy-h/2,ax;\n  if(t.align==='left')ax=left;else if(t.align==='right')ax=left+maxW;else ax=cx;\n  var hitX=t.align==='left'?left:(t.align==='right'?left+maxW-textW:cx-textW/2);\n  return {lines:lines,fs:fs,lh:lh,ax:ax,top:top,h:h,cx:hitX+textW/2,cy:top+h/2,rot:(t.rot||0)*Math.PI/180,hit:{x:hitX,y:top,w:textW,h:h}};\n}\n\n/* ---------- Zeichnen ---------- */\nfunction draw(ctx,cs,preview){\n  ctx.save();\n  ctx.fillStyle='#111';ctx.fillRect(0,0,cs.W,cs.H);\n  cs.rects.forEach(function(r,i){\n    var p=state.panels[i];\n    ctx.save();ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();\n    if(p.img){var ir=imageRect(p,r);ctx.drawImage(p.img,ir.x,ir.y,ir.w,ir.h);}\n    else{\n      ctx.fillStyle='#262a32';ctx.fillRect(r.x,r.y,r.w,r.h);\n      if(preview){\n        ctx.fillStyle='#d3d7de';ctx.textAlign='center';ctx.textBaseline='middle';\n        var fs=Math.min(r.w,r.h)*0.07;\n        ctx.font='700 '+fs*1.6+'px system-ui, sans-serif';ctx.fillText('+',r.x+r.w/2,r.y+r.h/2-fs*0.9);\n        ctx.font='600 '+fs+'px system-ui, sans-serif';ctx.fillText((cs.rects.length>1?'Bild '+(i+1)+' ':'Bild ')+'einfügen',r.x+r.w/2,r.y+r.h/2+fs*0.9);\n      }\n    }\n    if(state.labelsOn&&state.labels[i]){\n      var lfs=r.w*0.07,bh=lfs*1.6;\n      ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(r.x,r.y,r.w,bh);\n      ctx.font=fontString('meme',lfs);ctx.textAlign='center';ctx.textBaseline='middle';\n      ctx.lineJoin='round';ctx.lineWidth=lfs*0.08;ctx.strokeStyle='#000';ctx.fillStyle='#fff';\n      var lt=state.labels[i].toUpperCase();\n      ctx.strokeText(lt,r.x+r.w/2,r.y+bh/2,r.w*0.95);ctx.fillText(lt,r.x+r.w/2,r.y+bh/2,r.w*0.95);\n    }\n    ctx.restore();\n  });\n  if(cs.rects.length===2){ctx.fillStyle='#fff';var d=Math.max(2,cs.pw*0.004);if(state.layout==='stack')ctx.fillRect(0,cs.ph-d/2,cs.W,d);else ctx.fillRect(
