  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var p = document.body || document.documentElement;

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

              const { done, value } = await reader.read();

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0c6afc32-3ac2-4f36-80d9-6dff5a5d910d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\nhtml,body{margin:0;padding:0;background:#0a0a0a;-webkit-font-smoothing:antialiased;}\na{color:#ffb400;text-decoration:none;} a:hover{color:#d98f00;}\n[contenteditable]:hover{outline:1px dashed rgba(136,0,137,.55);outline-offset:2px;border-radius:2px;}\n[contenteditable]:focus{outline:2px dashed rgba(255,180,0,.75);outline-offset:2px;border-radius:2px;}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif\">\n  <div style=\"max-width:660px;margin:0 auto;padding:18px 16px 10px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-size:12px;line-height:1.5;color:#8a8a8a;border:1px solid #222;border-radius:8px;padding:8px 12px;background:#111\">Übungswerkzeug für Medienbildung – alle erstellten Artikel sind fiktiv. Tippe im Artikel auf Texte, um sie zu bearbeiten. Klicke auf die Bildfläche, um ein Bild hochzuladen (bleibt auf deinem Gerät).<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;align-items:center\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center\">\n        <button style=\"{{ tab1Style }}\" sc-camel-on-click=\"{{ setT1 }}\">Tagesschlau<\u002Fbutton>\n        <button style=\"{{ tab2Style }}\" sc-camel-on-click=\"{{ setT2 }}\">Schild<\u002Fbutton>\n        <button style=\"{{ tab3Style }}\" sc-camel-on-click=\"{{ setT3 }}\">Südkursiv<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center\">\n        <button sc-camel-on-click=\"{{ onExport }}\" style=\"padding:9px 16px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#880089,#ffb400);color:#fff\">Artikel als Bild herunterladen<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onReset }}\" style=\"padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #333;background:transparent;color:#aaa\">Zurücksetzen<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:center;padding:10px 16px 56px\">\n    <div style=\"width:392px;max-width:100%;border-radius:30px;border:1px solid #333;background:#181818;padding:7px;box-shadow:0 24px 70px rgba(0,0,0,.65)\">\n      <div id=\"bk-art\" ref=\"{{ artRef }}\" key=\"{{ artKey }}\" style=\"border-radius:23px;overflow:hidden;background:#fff;color:#111;height:820px;display:flex;flex-direction:column\">\n\n        <sc-if value=\"{{ isT1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e2e6eb\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <div style=\"width:30px;height:30px;background:#0a3d6e;border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden\">\n                  <div style=\"width:16px;height:16px;border:1.5px solid #ffffff;border-radius:50%\"><\u002Fdiv>\n                  <div style=\"position:absolute;width:24px;height:9px;border:1.5px solid rgba(255,255,255,.8);border-radius:50%;transform:rotate(-20deg)\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:19px;color:#0a3d6e\"><span style=\"font-weight:800\">tages<\u002Fspan><span style=\"font-weight:400\">schlau<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px;padding:4px\">\n                <div style=\"width:20px;height:2.5px;background:#0a3d6e\"><\u002Fdiv>\n                <div style=\"width:20px;height:2.5px;background:#0a3d6e\"><\u002Fdiv>\n                <div style=\"width:20px;height:2.5px;background:#0a3d6e\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:12px;color:#5a6b7d;border-bottom:1px solid #eef1f4\">\n              <span style=\"font-size:14px;line-height:1\">⌂<\u002Fspan><span>›<\u002Fspan>\n              <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"ressort\" sc-camel-on-input=\"{{ onEdit }}\">{{ ressort }}<\u002Fspan><span>›<\u002Fspan>\n              <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"ressort2\" sc-camel-on-input=\"{{ onEdit }}\" style=\"color:#0a3d6e;font-weight:600\">{{ ressort2 }}<\u002Fspan>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ pickImg }}\" sc-camel-on-drop=\"{{ onDrop }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" style=\"position:relative;cursor:pointer\">\n              <sc-if value=\"{{ hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                <img src=\"{{ img }}\" alt=\"\" style=\"display:block;width:100%;height:auto\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noImg }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"height:215px;background:repeating-linear-gradient(45deg,#e9ecef 0 12px,#f5f6f8 12px 24px);display:flex;align-items:center;justify-content:center\">\n                  <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#556;background:#fff;padding:6px 10px;border:1px dashed #99a\">[ Artikelbild — klicken zum Hochladen ]<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"position:absolute;right:8px;bottom:8px;background:rgba(10,20,30,.75);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px\">1 Min<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:14px 14px 20px\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin:0 0 8px\">\n                <span sc-camel-on-click=\"{{ cycleBadge }}\" title=\"Klicken: Badge wechseln\" style=\"background:#0a3d6e;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;cursor:pointer;user-select:none\">{{ badge }}<\u002Fspan>\n                <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"dach\" sc-camel-on-input=\"{{ onEdit }}\" style=\"color:#0a3d6e;font-weight:700;font-size:14px\">{{ dach }}<\u002Fspan>\n              <\u002Fdiv>\n              <h1 sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"head\" sc-camel-on-input=\"{{ onEdit }}\" style=\"margin:0 0 8px;font-size:26px;line-height:1.18;color:#0a3d6e;font-weight:800;text-wrap:pretty\">{{ head }}<\u002Fh1>\n              <div style=\"font-style:italic;color:#7a828c;font-size:12.5px;margin:0 0 12px\">Stand: <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"datum\" sc-camel-on-input=\"{{ onEdit }}\">{{ datum }}<\u002Fspan> • <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"zeit\" sc-camel-on-input=\"{{ onEdit }}\">{{ zeit }}<\u002Fspan> Uhr<\u002Fdiv>\n              <p sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"teaser\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-weight:700;color:#33393f;font-size:16px;line-height:1.45;margin:0 0 14px\">{{ teaser }}<\u002Fp>\n              <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 14px\">\n                <div style=\"width:38px;height:38px;border-radius:50%;background:#c9d5e1;color:#0a3d6e;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0\">{{ initials }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:#5a6470\">Von <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"author\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-weight:600;color:#33393f\">{{ author }}<\u002Fspan>, TSL-Hauptstadtstudio<\u002Fdiv>\n              <\u002Fdiv>\n              <p sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"body\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-size:15.5px;line-height:1.55;color:#26292d;margin:0\">{{ body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isT2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#dd0000\">\n              <div style=\"display:flex;align-items:center;gap:9px\">\n                <div style=\"border:3px solid #fff;padding:1px 9px 3px;transform:skewX(-7deg);color:#fff;font-weight:900;font-style:italic;font-size:23px;letter-spacing:1px;line-height:1.2\">S!<\u002Fdiv>\n                <div style=\"color:#fff;font-weight:900;font-style:italic;font-size:26px;letter-spacing:1px;transform:skewX(-4deg)\">SCHILD<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px;padding:4px\">\n                <div style=\"width:20px;height:2.5px;background:#ffffff\"><\u002Fdiv>\n                <div style=\"width:20px;height:2.5px;background:#ffffff\"><\u002Fdiv>\n                <div style=\"width:20px;height:2.5px;background:#ffffff\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#000;color:#fff;text-align:center;font-weight:800;font-size:13px;letter-spacing:3px;padding:5px 0\">+++ EXKLUSIV +++<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ pickImg }}\" sc-camel-on-drop=\"{{ onDrop }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" style=\"position:relative;cursor:pointer\">\n              <sc-if value=\"{{ hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                <img src=\"{{ img }}\" alt=\"\" style=\"display:block;width:100%;height:auto\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noImg }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"height:265px;background:repeating-linear-gradient(45deg,#e9e9e9 0 12px,#f6f6f6 12px 24px);display:flex;align-items:center;justify-content:center\">\n                  <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#555;background:#fff;padding:6px 10px;border:1px dashed #999\">[ Artikelbild — klicken zum Hochladen ]<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"padding:12px 14px 20px\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap\">\n                <span style=\"background:#dd0000;color:#fff;font-size:12px;font-weight:900;padding:3px 9px;border-radius:3px;letter-spacing:.5px\">SCHILD<span style=\"color:#ffd200\">plus<\u002Fspan><\u002Fspan>\n                <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"dach\" sc-camel-on-input=\"{{ onEdit }}\" style=\"color:#dd0000;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px\">{{ dach }}<\u002Fspan>\n              <\u002Fdiv>\n              <h1 sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"head\" sc-camel-on-input=\"{{ onEdit }}\" style=\"margin:0 0 10px;font-size:31px;line-height:1.05;color:#000;font-weight:900;text-transform:uppercase;text-wrap:pretty\">{{ head }}<\u002Fh1>\n              <p sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"teaser\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-weight:700;color:#111;font-size:15.5px;line-height:1.35;margin:0 0 10px\">{{ teaser }}<\u002Fp>\n              <div style=\"font-size:12px;color:#777;border-top:1px solid #e5e5e5;padding-top:8px\">Von <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"author\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-weight:700;color:#333\">{{ author }}<\u002Fspan> &nbsp;|&nbsp; <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"datum\" sc-camel-on-input=\"{{ onEdit }}\">{{ datum }}<\u002Fspan>, <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"zeit\" sc-camel-on-input=\"{{ onEdit }}\">{{ zeit }}<\u002Fspan> Uhr<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isT3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:Georgia,'Times New Roman',serif\">\n            <div style=\"text-align:center;padding:18px 14px 10px\">\n              <div style=\"font-style:italic;font-size:27px;color:#111;letter-spacing:.3px\">Südkursiv<\u002Fdiv>\n              <div style=\"margin:10px auto 0;border-top:2px solid #111;border-bottom:1px solid #111;height:3px;width:100%\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:14px 18px 24px\">\n              <div sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"ressort\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-family:-apple-system,'Segoe UI',Helvetica,sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#14532d;font-weight:600;margin:0 0 10px\">{{ ressort }}<\u002Fdiv>\n              <h1 sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"head\" sc-camel-on-input=\"{{ onEdit }}\" style=\"margin:0 0 10px;font-size:25px;line-height:1.25;color:#111;font-weight:700;text-wrap:pretty\">{{ head }}<\u002Fh1>\n              <p sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"teaser\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-size:16px;line-height:1.55;color:#3a3a3a;margin:0 0 14px\">{{ teaser }}<\u002Fp>\n              <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:10px 0;border-top:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3\">\n                <div style=\"width:30px;height:30px;border-radius:50%;border:1px solid #14532d;color:#14532d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;font-family:-apple-system,'Segoe UI',Helvetica,sans-serif;flex-shrink:0\">{{ initials }}<\u002Fdiv>\n                <div style=\"font-family:-apple-system,'Segoe UI',Helvetica,sans-serif;font-size:12.5px;color:#555\">Von <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"author\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-weight:600;color:#222\">{{ author }}<\u002Fspan> · <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"datum\" sc-camel-on-input=\"{{ onEdit }}\">{{ datum }}<\u002Fspan>, <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"zeit\" sc-camel-on-input=\"{{ onEdit }}\">{{ zeit }}<\u002Fspan> Uhr<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ pickImg }}\" sc-camel-on-drop=\"{{ onDrop }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" style=\"cursor:pointer;margin:14px 0 4px\">\n                <sc-if value=\"{{ hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img src=\"{{ img }}\" alt=\"\" style=\"display:block;width:100%;height:auto\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ noImg }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"height:175px;background:repeating-linear-gradient(45deg,#ececec 0 12px,#f7f7f7 12px 24px);display:flex;align-items:center;justify-content:center\">\n                    <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#556;background:#fff;padding:6px 10px;border:1px dashed #99a\">[ Bild — klicken zum Hochladen ]<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-family:-apple-system,'Segoe UI',Helvetica,sans-serif;font-size:11px;color:#999;margin:0 0 14px\">Symbolbild (Übungsmaterial)<\u002Fdiv>\n              <p sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" sc-camel-spell-check=\"false\" data-field=\"body\" sc-camel-on-input=\"{{ onEdit }}\" style=\"font-size:15.5px;line-height:1.65;color:#222;margin:0\">{{ body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <input type=\"file\" accept=\"image/*\" id=\"bk-file\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none\">\n  <div style=\"text-align:center;padding:0 16px 22px;margin-top:-28px;font-size:12px;color:#666\"><a href=\"https://www.medienpädagogik.info\" target=\"_blank\" rel=\"noopener\" style=\"color:#666;text-decoration:none\" style-hover=\"color:#aaa\">www.medienpädagogik.info<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startTemplate&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Tagesschlau&quot;,&quot;Schild&quot;,&quot;Südkursiv&quot;],&quot;default&quot;:&quot;Tagesschlau&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Werkzeug&quot;},&quot;exportScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:4,&quot;step&quot;:1,&quot;unit&quot;:&quot;×&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Werkzeug&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    const now = new Date(), z = n => String(n).padStart(2, '0');\n    this.defaults = {\n      dach: 'Bildungspolitik',\n      head: 'Stadtrat beschließt kostenloses Mittagessen an allen Schulen',\n      teaser: 'Ab dem kommenden Schuljahr sollen alle Kinder der Stadt ein kostenloses Mittagessen bekommen. Der Beschluss fiel überraschend deutlich aus – doch die Finanzierung ist noch offen.',\n      body: 'Nach monatelanger Debatte stimmte der Stadtrat am Abend mit großer Mehrheit für den Vorschlag. Befürworter sprechen von einem wichtigen Schritt für mehr Chancengleichheit. Kritikerinnen und Kritiker bezweifeln jedoch, dass die Umsetzung bis zum Schulstart gelingt.',\n      author: 'Alex Muster', ressort: 'Inland', ressort2: 'Bildung',\n      datum: z(now.getDate()) + '.' + z(now.getMonth() + 1) + '.' + now.getFullYear(),\n      zeit: z(now.getHours()) + ':' + z(now.getMinutes())\n    };\n    this.data = Object.assign({}, this.defaults);\n    this.snap = Object.assign({}, this.data);\n    const tplMap = { 'Tagesschlau': 't1', 'Schild': 't2', 'Südkursiv': 't3' };\n    this.state = { tpl: tplMap[p.startTemplate] || 't1', badgeIdx: 0, img: null, nonce: 0 };\n    this.badges = ['FAQ', 'Liveblog', 'Analyse', 'Exklusiv', 'Interview'];\n    this.fileRef = React.createRef();\n    this.artRef = React.createRef();\n  }\n  setTpl(t) { this.snap = Object.assign({}, this.data); this.setState({ tpl: t }); }\n  loadImgFile(f) {\n    if (!f || !f.type || f.type.indexOf('image/') !== 0) return;\n    const r = new FileReader();\n    r.onload = () => this.setState({ img: r.result });\n    r.readAsDataURL(f);\n  }\n  tabStyle(active) {\n    return active\n      ? { padding: '9px 16px', borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: 'pointer', border: '1px solid transparent', background: 'linear-gradient(135deg,#880089,#ffb400)', color: '#fff', fontFamily: 'inherit' }\n      : { padding: '9px 16px', borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: 'pointer', border: '1px solid #333', background: '#161616', color: '#ccc', fontFamily: 'inherit' };\n  }\n  async exportPng() {\n    try {\n      const node = this.artRef.current || document.getElementById('bk-art');\n      if (!node) { alert('Artikel-Ansicht nicht gefunden.'); return; }\n      const w = node.offsetWidth, h = node.offsetHeight;\n      const clone = node.cloneNode(true);\n      const copyStyles = (src, dst) => {\n        const cs = getComputedStyle(src); let t = '';\n        for (let i = 0; i < cs.length; i++) { const pr = cs[i]; t += pr + ':' + cs.getPropertyValue(pr) + ';'; }\n        dst.setAttribute('style', t);\n        for (let i = 0; i < src.children.length; i++) copyStyles(src.children[i], dst.children[i]);\n      };\n      copyStyles(node, clone);\n      clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));\n      clone.style.margin = '0'; clone.style.borderRadius = '0';\n      clone.style.width = w + 'px'; clone.style.height = h + 'px'; clone.style.boxSizing = 'border-box';\n      clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');\n      const xhtml = new XMLSerializer().serializeToString(clone);\n      const svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"' + w + '\" height=\"' + h + '\"><foreignObject width=\"100%\" height=\"100%\">' + xhtml + '<\u002FforeignObject><\u002Fsvg>';\n      const img = new Image();\n      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });\n      const scale = this.props.exportScale ?? 2;\n      const c = document.createElement('canvas');\n      c.width = Math.round(w * scale); c.height = Math.round(h * scale);\n      const ctx = c.getContext('2d');\n      ctx.scale(scale, scale); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0);\n      const names = { t1: 'tagesschlau', t2: 'schild', t3: 'suedkursiv' };\n      const a = document.createElement('a');\n      a.download = 'artikel-' + names[this.state.tpl] + '.png';\n      a.href = c.toDataURL('image/png');\n      a.click();\n    } catch (err) {\n      alert('Export fehlgeschlagen: ' + err.message);\n    }\n  }\n  renderVals() {\n    const s = this.state, d = this.snap;\n    return Object.assign({}, d, {\n      isT1: s.tpl === 't1', isT2: s.tpl === 't2', isT3: s.tpl === 't3',\n      hasImg: !!s.img, noImg: !s.img, img: s.img,\n      badge: this.badges[s.badgeIdx],\n      artKey: s.tpl + '-' + s.nonce,\n      initials: (this.data.author || 'A M').trim().split(/\\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase(),\n      tab1Style: this.tabStyle(s.tpl === 't1'),\n      tab2Style: this.tabStyle(s.tpl === 't2'),\n      tab3Style: this.tabStyle(s.tpl === 't3'),\n      setT1: () => this.setTpl('t1'),\n      setT2: () => this.setTpl('t2'),\n      setT3: () => this.setTpl('t3'),\n      cycleBadge: () => this.setState(st => ({ badgeIdx: (st.badgeIdx + 1) % this.badges.length })),\n      onEdit: e => { const f = e.currentTarget.dataset.field; if (f) this.data[f] = e.currentTarget.innerText; },\n      pickImg: () => {\n        const inp = this.fileRef.current || document.getElementById('bk-file');\n        if (inp) inp.click();\n      },\n      onFile: e => { this.loadImgFile(e.target.files && e.target.files[0]); e.target.value = ''; },\n      onDragOver: e => { e.preventDefault(); },\n      onDrop: e => {\n        e.preventDefault(); e.stopPropagation();\n        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];\n        this.loadImgFile(f);\n      },\n      onReset: () => {\n        if (!confirm('Alle Eingaben und das Bild zurücksetzen?')) return;\n        this.data = Object.assign({}, this.defaults);\n        this.snap = Object.assign({}, this.data);\n        this.setState(st => ({ img: null, badgeIdx: 0, nonce: st.nonce + 1 }));\n      },\n      onExport: () => this.exportPng()\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
