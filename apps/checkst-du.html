document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

                 <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#8a8175;padding:6px 4px 0;border-top:1px solid #e6dfd2;margin-top:2px;\">Zwei Bildschirme<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ chooseScreen }}\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:48px;padding:10px 14px;border:2px solid #211d18;border-radius:10px;background:#fffdf8;color:#211d18;cursor:pointer;text-align:left;\" style-hover=\"background:#ebe5da;\">\n                      <span style=\"font-size:16px;font-weight:800;\">⧉ Zweitbildschirm<\u002Fspan>\n                      <span style=\"font-size:13px;font-weight:500;color:#5c554b;\">Eigenes Fenster – auf den zweiten Monitor ziehen.<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ rechooseScale }}\" style=\"min-height:52px;padding:12px 18px;border:2px solid #211d18;border-radius:12px;background:#fffdf8;color:#211d18;font-size:18px;font-weight:700;cursor:pointer;\">↺ Zielbereich neu würfeln<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ popupBlocked }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:12px;background:#fffdf8;border:2px solid #a3541a;border-radius:14px;padding:10px 14px;max-width:min(560px,92vw);\">\n                <span style=\"font-size:15px;font-weight:700;color:#a3541a;text-wrap:pretty;\">Popup wurde blockiert – bitte Popups im Browser erlauben oder die App in einem eigenen Tab öffnen.<\u002Fspan>\n                <button sc-camel-on-click=\"{{ dismissPopupBlocked }}\" style=\"min-height:44px;min-width:44px;border:2px solid #211d18;border-radius:10px;background:transparent;font-size:16px;font-weight:800;cursor:pointer;flex-shrink:0;\">✕<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showQrInline }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:12px;background:#fffdf8;border:2px solid #211d18;border-radius:14px;padding:12px 14px;box-shadow:0 4px 0 rgba(33,29,24,0.2);max-width:min(560px,92vw);\">\n                <div style=\"display:flex;align-items:center;gap:10px;\">\n                  <div style=\"display:flex;border:2px solid #211d18;border-radius:999px;overflow:hidden;\">\n                    <button sc-camel-on-click=\"{{ setQrModeText }}\" style=\"min-height:40px;padding:8px 16px;border:none;background:{{ qrTextBg }};color:{{ qrTextFg }};font-size:14px;font-weight:700;cursor:pointer;\">📄 Text<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ setQrModeLink }}\" style=\"min-height:40px;padding:8px 16px;border:none;background:{{ qrLinkBg }};color:{{ qrLinkFg }};font-size:14px;font-weight:700;cursor:pointer;\">🌐 Link<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;\"><\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ toggleQr }}\" aria-label=\"Schließen\" style=\"min-height:40px;min-width:40px;border:2px solid #211d18;border-radius:10px;background:transparent;color:#211d18;font-size:16px;font-weight:800;cursor:pointer;\">✕<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:14px;\">\n                  <sc-if value=\"{{ qrReady }}\" hint-placeholder-val=\"{{ false }}\">\n                    <img src=\"{{ qrDataUrl }}\" alt=\"QR-Code mit Zielbereich\" style=\"width:96px;height:96px;image-rendering:pixelated;border:2px solid #211d18;border-radius:8px;flex-shrink:0;\">\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ qrNotReady }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"width:96px;height:96px;display:flex;align-items:center;justify-content:center;border:2px dashed #8a8175;border-radius:8px;font-size:12px;color:#8a8175;text-align:center;flex-shrink:0;\">QR lädt…<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                    <sc-if value=\"{{ qrModeIsText }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"font-size:14px;line-height:1.5;text-wrap:pretty;\">Kamera zeigt den Zielbereich als Text – funktioniert ohne Internet. Der Code ist bewusst klein: Scannen geht nur nah am Bildschirm.<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ qrModeIsLink }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:14px;line-height:1.5;text-wrap:pretty;\">Scannen öffnet die Online-Version mit dem Zielbereich als Rad. Handy braucht Internet.<\u002Fdiv>\n                      <input value=\"{{ qrUrl }}\" sc-camel-on-change=\"{{ setQrUrl }}\" placeholder=\"Adresse der Online-Version, z.B. meine-seite.de/checkstdu.html\" style=\"min-height:44px;padding:8px 12px;font-size:14px;border:2px solid #211d18;border-radius:8px;background:#fffdf8;color:#211d18;outline:none;width:min(320px,70vw);\">\n                      <sc-if value=\"{{ qrLinkMissingUrl }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-size:13px;font-weight:700;color:#a3541a;\">Ohne Adresse wird weiter der Text-QR angezeigt.<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fsc-if>\n                    <div style=\"font-size:13px;font-weight:700;color:#a3541a;\">Fair play: Nur der Feed-Master*in scannt!<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <div style=\"display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:14px;background:#ebe5da;\">\n            <span style=\"font-size:16px;font-weight:700;color:#5c554b;padding:0 6px;\">{{ otherName }} tippt:<\u002Fspan>\n            <button sc-camel-on-click=\"{{ tipLeft }}\" style=\"min-height:44px;padding:10px 16px;border:2px solid {{ tipLeftBorder }};border-radius:10px;background:{{ tipLeftBg }};color:{{ tipLeftFg }};font-size:16px;font-weight:700;cursor:pointer;\">← weiter links<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ tipRight }}\" style=\"min-height:44px;padding:10px 16px;border:2px solid {{ tipRightBorder }};border-radius:10px;background:{{ tipRightBg }};color:{{ tipRightFg }};font-size:16px;font-weight:700;cursor:pointer;\">weiter rechts →<\u002Fbutton>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ resolve }}\" disabled=\"{{ resolveDisabled }}\" style=\"min-height:52px;padding:12px 28px;border:2px solid #211d18;border-radius:12px;background:{{ resolveBg }};color:{{ resolveFg }};font-size:19px;font-weight:800;cursor:pointer;opacity:{{ resolveOpacity }};box-shadow:0 3px 0 #211d18;\">Auflösen<\u002Fbutton>\n        \n      <\u002Fdiv>\n    <\u002Fsc-if><\u002Fdiv><\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- QR-Ansicht (Handy des Feed-Master*ins) -->\n  <sc-if value=\"{{ isQrView }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 14px;\">\n      <div style=\"font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#a3541a;\">🤫 Nur für den Feed-Master*in<\u002Fdiv>\n      <div style=\"width:min(680px,96vw);\">{{ qrViewWheel }}<\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:800;\">Zielbereich: Felder {{ qrViewFrom }}–{{ qrViewTo }}<\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- Sieg -->\n  <sc-if value=\"{{ isWin }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 20px;text-align:center;\">\n      <div style=\"font-size:clamp(24px,4vw,36px);font-weight:700;color:#5c554b;\">🏆 Gewonnen!<\u002Fdiv>\n      <div style=\"font-size:clamp(56px,10vw,110px);font-weight:800;letter-spacing:-2px;color:{{ winnerColor }};line-height:1.05;\">{{ winnerName }}<\u002Fdiv>\n      <div style=\"font-size:clamp(20px,3vw,28px);font-weight:600;\">Endstand&nbsp; {{ nameA }} {{ scoreA }} : {{ scoreB }} {{ nameB }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ newGame }}\" style=\"min-height:56px;padding:14px 36px;border:2px solid #211d18;border-radius:12px;background:#f0b64a;color:#211d18;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #211d18;\">Neues Spiel<\u002Fbutton>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- Anleitung Overlay -->\n  <sc-if value=\"{{ showHelp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ toggleHelp }}\" style=\"position:fixed;inset:0;background:rgba(33,29,24,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" style=\"background:#fffdf8;border:2px solid #211d18;border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:28px 30px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;\">\n          <div style=\"font-size:26px;font-weight:800;\">Spielanleitung<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleHelp }}\" style=\"min-height:44px;min-width:44px;border:2px solid #211d18;border-radius:10px;background:transparent;font-size:18px;font-weight:800;cursor:pointer;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.55;display:flex;flex-direction:column;gap:14px;margin-top:14px;\">\n          <div style=\"padding:12px 14px;border-radius:10px;background:#ebe5da;font-size:16px;text-wrap:pretty;\"><strong>Auftrag zum Vorlesen:<\u002Fstrong> „Eine Person kennt einen geheimen Zielwert auf der Skala und wählt dazu einen passenden Medieninhalt aus. Euer Team diskutiert: Wo würdet ihr den Inhalt einordnen – und warum? Es geht nicht darum, sofort die richtige Antwort zu kennen, sondern eure Einschätzung nachvollziehbar zu begründen.“<\u002Fdiv>\n          <div><strong>Ihr braucht:<\u002Fstrong> 2 Teams (je 3–10 Personen), vorab 3–5 Skalen und passende Inhalte aus dem Fundus, diese App bei der Spielleitung.<\u002Fdiv>\n          <div style=\"font-weight:800;font-size:19px;\">Eine Runde – Team A ist dran:<\u002Fdiv>\n          <ol style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;\">\n            <li>Team A bestimmt eine Person als Feed-Master*in (wechselt jede Runde)<\u002Fli>\n            <li>Skala wählen – beide Pole und die Richtung kurz für alle klären<\u002Fli>\n            <li>Nur Feed-Master*in sieht den verdeckten Zielbereich<\u002Fli>\n            <li>Feed-Master*in wählt aus dem Fundus einen Inhalt, der nach eigener Einschätzung in den Zielbereich passt – und hält sich danach zurück<\u002Fli>\n            <li>Team A diskutiert und legt gemeinsam eine Position auf der Skala fest<\u002Fli>\n            <li>Team B tippt: Liegt der Zielbereich weiter links oder weiter rechts?<\u002Fli>\n            <li>Auflösen – Punkte sind optional: Team A im Zielbereich → 2, 3 oder 4 Punkte. Team A daneben und Team B richtig getippt → 1 Punkt für Team B<\u002Fli>\n            <li>Ein bis zwei Reflexionsfragen stellen, z.&nbsp;B. „Woran habt ihr eure Einschätzung festgemacht?“ oder „Warum lag der Inhalt für dich genau dort?“<\u002Fli>\n            <li>Jetzt ist Team B dran und bestimmt eine neue Feed-Master*in<\u002Fli>\n          <\u002Fol>\n          <div><strong>Spielende:<\u002Fstrong> nach einer vorher festgelegten Rundenzahl oder sobald ein Team 10 Punkte hat. Kurz gemeinsam reflektieren.<\u002Fdiv>\n          <div style=\"font-size:15px;color:#5c554b;text-wrap:pretty;\"><strong>Einordnung statt Wahrheitstest:<\u002Fstrong> Auf vielen Skalen gibt es kein objektiv richtiges Feld – der Zielbereich zeigt die persönliche Einordnung der Feed-Master*in. Bei überprüfbaren Sachfragen (z.&nbsp;B. echt – KI) kann die Spielleitung nach der Diskussion die im Fundus hinterlegte Einordnung auflösen.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Footer -->\n  <footer style=\"padding:14px 22px;text-align:center;font-size:14px;color:#8a8175;border-top:1px solid #e6dfd2;\">\n    <a href=\"https://www.xn--medienpdagogik-cib.info/\" target=\"_blank\" rel=\"noopener\" style=\"color:#2f6b9e;\">www.medienpädagogik.info<\u002Fa>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;punkteziel&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:3,&quot;max&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Spielregeln&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.SCALES = [\n      { name: 'Echtheit & Herkunft', scales: [['echt','fake'],['echt','KI'],['unbearbeitet','stark bearbeitet']] },\n      { name: 'Absicht', scales: [['informieren','manipulieren'],['Satire','ernst gemeint'],['Journalismus','Werbung']] },\n      { name: 'Wirkung', scales: [['sachlich','emotionalisierend'],['No-bait','Clickbait'],['harmlos','gefährlich'],['aufklärend','irreführend'],['kritisch','hetzerisch']] },\n      { name: 'Handlungsebene', scales: [['würde ich sofort teilen','würde ich nie teilen'],['glaube ich sofort','glaube ich nie']] },\n      { name: 'Quelle & Einordnung', scales: [['vertrauenswürdige Quelle','zweifelhafte Quelle'],['Meinung','Fakt'],['lokal','global']] },\n    ];\n    this.PTS = [2,3,4,3,2];\n    this.state = this.freshGame();\n  }\n  freshGame() {\n    return { phase:'start', inputA:'', inputB:'', nameA:'Team A', nameB:'Team B',\n      winScore: this.props.punkteziel ?? 10, showHint: false,\n      scores:[0,0], active:0, scale:null, target:null, pointer:9, tip:null,\n      peek:false, resolved:false, resultMsg:'', winner:null, showHelp:false, showQr:false, screenActive:false, popupHidden:true, popupBlocked:false, spickOpen:false, spickMethod: this.lsGet('checkstdu.spick') || 'halten',\n      qrMode: this.lsGet('checkstdu.qrMode') || 'text', qrUrl: this.lsGet('checkstdu.qrUrl') || '' };\n  }\n  lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }\n  lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }\n  componentDidMount() {\n    const m = (location.hash || '').match(/ziel=(\\d+)/);\n    if (m) {\n      const t = Math.min(15, Math.max(0, parseInt(m[1], 10)));\n      this.setState({ phase:'qrview', target:t, pointer:null });\n    }\n    this._winPoll = setInterval(() => {\n      if (this.state.screenActive && (!this.popupWin || this.popupWin.closed)) this.setState({ screenActive: false });\n    }, 1000);\n  }\n  componentWillUnmount() { clearInterval(this._winPoll); }\n  doNextRound() {\n    const st = this.state;\n    if (st.winner != null) this.setState({ phase:'win' });\n    else this.setState({ ...this.freshRound(1 - st.active), phase:'pick' });\n  }\n  controlsHtml() {\n    const st = this.state, names = [st.nameA, st.nameB];\n    const btn = 'min-height:48px;padding:10px 18px;border:2px solid #211d18;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;';\n    if (!st.resolved) {\n      const sel = d => st.tip === d ? 'background:#211d18;color:#f6f2ea;' : 'background:#fffdf8;color:#211d18;';\n      const can = st.pointer != null && !!st.tip;\n      return `<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:16px;\">\n        <span style=\"font-size:16px;font-weight:700;color:#5c554b;\">${names[1 - st.active]} tippt:<\u002Fspan>\n        <button data-act=\"tipL\" style=\"${btn}${sel('links')}\">← weiter links<\u002Fbutton>\n        <button data-act=\"tipR\" style=\"${btn}${sel('rechts')}\">weiter rechts →<\u002Fbutton>\n        <button data-act=\"redraw\" style=\"${btn}background:#fffdf8;color:#211d18;\">↺ Neu würfeln<\u002Fbutton>\n        <button data-act=\"resolve\" ${can ? '' : 'disabled'} style=\"${btn}background:${can ? '#f0b64a' : '#ebe5da'};color:#211d18;opacity:${can ? 1 : 0.5};box-shadow:0 3px 0 #211d18;font-weight:800;\">Auflösen<\u002Fbutton>\n      <\u002Fdiv>`;\n    }\n    return `<div style=\"display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:16px;\">\n      <div style=\"padding:12px 20px;border:2px solid #211d18;border-radius:12px;background:#fffdf8;font-size:18px;font-weight:700;text-align:center;max-width:600px;\">${st.resultMsg}<\u002Fdiv>\n      <button data-act=\"next\" style=\"${btn}background:#f0b64a;color:#211d18;font-weight:800;box-shadow:0 3px 0 #211d18;\">${st.winner != null ? '🏆 Zum Sieg-Screen' : 'Nächste Runde'}<\u002Fbutton>\n    <\u002Fdiv>`;\n  }\n  bindActs(w) {\n    w.document.querySelectorAll('[data-act]').forEach(b => {\n      b.onclick = () => {\n        const a = b.getAttribute('data-act');\n        if (a === 'tipL') this.setState({ tip:'links' });\n        else if (a === 'tipR') this.setState({ tip:'rechts' });\n        else if (a === 'redraw') this.setState({ target: Math.floor(Math.random() * 16), tip:null, peek:false });\n        else if (a === 'resolve') this.resolveRound();\n        else if (a === 'next') this.doNextRound();\n        else if (a === 'reveal') this.setState({ popupHidden: false });\n        else if (a === 'start') { const s = this.state; this.setState({ phase:'pick', nameA: s.inputA.trim() || 'Team A', nameB: s.inputB.trim() || 'Team B', showQr: s.spickMethod === 'qr' }); }\n        else if (a === 'randScale') { const all = this.SCALES.flatMap(g => g.scales); const [left, right] = all[Math.floor(Math.random() * all.length)]; this.pickScale({ left, right }); }\n      };\n    });\n    w.document.querySelectorAll('[data-in]').forEach(inp => {\n      inp.oninput = () => {\n        const k = inp.getAttribute('data-in');\n        if (k === 'a') this.state.inputA = inp.value;\n        else if (k === 'b') this.state.inputB = inp.value;\n        else if (k === 'w') this.state.winScore = Math.max(1, parseInt(inp.value, 10) || 0);\n      };\n    });\n    w.document.querySelectorAll('[data-scale]').forEach(b => {\n      b.onclick = () => {\n        const [gi, si] = b.getAttribute('data-scale').split('-').map(Number);\n        const [left, right] = this.SCALES[gi].scales[si];\n        this.pickScale({ left, right });\n      };\n    });\n  }\n  scalesHtml() {\n    const st = this.state;\n    const groups = this.SCALES.map((g, gi) => `<div style=\"margin-bottom:12px;\"><div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8a8175;margin-bottom:6px;\">${g.name}<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:8px;\">${g.scales.map((s, si) => `<button data-scale=\"${gi}-${si}\" style=\"min-height:42px;padding:8px 14px;border:2px solid #211d18;border-radius:10px;background:#fffdf8;color:#211d18;font-size:15px;font-weight:600;cursor:pointer;\">${s[0]} – ${s[1]}<\u002Fbutton>`).join('')}<\u002Fdiv><\u002Fdiv>`).join('');\n    return `<div style=\"text-align:left;\"><div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;\"><div style=\"font-size:18px;font-weight:800;\">${[st.nameA, st.nameB][st.active]} ist dran – Skala wählen:<\u002Fdiv><button data-act=\"randScale\" style=\"min-height:44px;padding:8px 18px;border:2px solid #211d18;border-radius:10px;background:#f0b64a;color:#211d18;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #211d18;\">🎲 Zufällige Skala<\u002Fbutton><\u002Fdiv>${groups}<\u002Fdiv>`;\n  }\n  freshRound(active) {\n    return { scale:null, target:null, pointer:9, tip:null, peek:false, resolved:false, resultMsg:'', active };\n  }\n  componentDidUpdate() { this.syncPopup(); }\n  targetText() {\n    const t = this.state.target;\n    return t == null ? '' : `Checkst du? Zielbereich: Felder ${t + 1} bis ${t + 5} (Mitte: ${t + 3})`;\n  }\n  makeQrDataUrl() {\n    const st = this.state;\n    if (st.target == null || typeof window.qrcode !== 'function') return '';\n    let data = this.targetText();\n    if (st.qrMode === 'link' && st.qrUrl.trim()) {\n      let u = st.qrUrl.trim();\n      if (!/^https?:\\/\\//i.test(u)) u = 'https://' + u;\n      data = u + '#ziel=' + st.target;\n    }\n    try {\n      const qr = window.qrcode(0, 'M');\n      qr.addData(data);\n      qr.make();\n      return qr.createDataURL(6, 8);\n    } catch (e) { return ''; }\n  }\n  wheelSvg(hideTarget) {\n    const st = this.state, PCOL = { 2:'#f6dfae', 3:'#f0c46f', 4:'#e8a53a' };\n    let s = '';\n    for (let i = 0; i < 20; i++) {\n      const inT = !hideTarget && st.target != null && i >= st.target && i <= st.target + 4;\n      const p = inT ? this.PTS[i - st.target] : 0;\n      let fill = i % 2 ? '#e6dfd2' : '#efe9dd';\n      if (p) fill = PCOL[p];\n      s += `<path d=\"${this.segPath(i)}\" fill=\"${fill}\" stroke=\"#f6f2ea\" stroke-width=\"2\" data-i=\"${i}\" style=\"cursor:pointer;\"><\u002Fpath>`;\n      const mid = 180 - (i + 0.5) * 9;\n      const [tx, ty] = this.pt(356, mid);\n      s += `<text x=\"${Math.round(tx)}\" y=\"${Math.round(ty) + 7}\" text-anchor=\"middle\" font-size=\"14\" font-style=\"italic\" font-weight=\"500\" fill=\"${p ? '#211d18' : '#8a8175'}\">${i + 1}<\u002Ftext>`;\n      if (p) {\n        const [px, py] = this.pt(255, mid);\n        s += `<text x=\"${Math.round(px)}\" y=\"${Math.round(py) + 9}\" text-anchor=\"middle\" font-size=\"30\" font-weight=\"800\" fill=\"#211d18\">${p}<\u002Ftext>`;\n      }\n    }\n    s += '<path d=\"M 72 452 A 328 328 0 0 1 728 452\" fill=\"none\" stroke=\"#f6f2ea\" stroke-width=\"3\"><\u002Fpath>';\n    if (st.pointer != null) {\n      const nmid = 180 - (st.pointer + 0.5) * 9;\n      const [tipx, tipy] = this.pt(330, nmid);\n      const [b1x, b1y] = this.pt(14, nmid + 90);\n      const [b2x, b2y] = this.pt(14, nmid - 90);\n      s += `<path d=\"M ${tipx} ${tipy} L $
