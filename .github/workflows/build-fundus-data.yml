name: Build fundus-data.js & export-templates-data.js

on:
  push:
    branches: [main]
    paths:
      - fundus.yaml
      - export-templates/**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build deps
        working-directory: build
        run: npm install

      - name: Compile fundus.yaml + export-templates/ -> *-data.js
        working-directory: build
        run: npm run build:all

      - name: Commit generated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild fundus-data.js / export-templates-data.js"
          file_pattern: fundus-data.js export-templates-data.js
